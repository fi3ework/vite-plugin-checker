name: Screenshots

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'playground/docs-screenshot/**'
      - 'scripts/screenshots.ts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.repository_owner == 'fi3ework'
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true

      - name: Set Playwright path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV

      - name: Cache Playwright's binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-bin-v1
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Install Playwright
        run: pnpm playwright install chromium

      - name: Build
        run: pnpm run build

      - name: Take screenshots
        run: pnpm run docs:screenshots

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/update-screenshots
        run: |
          if [ -z "$(git status --porcelain -- docs/public/screenshots)" ]; then
            echo "Screenshots are up to date"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add docs/public/screenshots
          git commit -m 'docs: update screenshots'
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'docs: update screenshots' \
              --body "Regenerated by the [Screenshots workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA."
          fi
